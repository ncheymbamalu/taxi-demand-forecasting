[project]
name = "src"
version = "0.1.0"
description = ""
authors = [{ name = "ncheymbamalu", email = "nchey.learnings@gmail.com" }]
requires-python = "==3.10.14"
readme = "README.md"
dependencies = [
    "dvc>=3.59.2",
    "dvc-gdrive>=3.0.1",
    "httpx>=0.28.1",
    "hyperopt>=0.2.7",
    "ipykernel>=6.29.5,<7",
    "jupyter>=1.0.0,<2",
    "lightgbm>=4.6.0",
    "loguru>=0.7.2,<0.8",
    "matplotlib>=3.10.1",
    "mrmr-selection>=0.2.8",
    "nbformat>=5.10.4",
    "notebook>=7.3.2",
    "numpy==1.26.4",
    "omegaconf>=2.3.0",
    "pandas>=2.2.3",
    "plotly>=6.0.0",
    "polars==1.24.0",
    "pyarrow>=19.0.1",
    "python-dotenv>=1.0.1,<2",
    "scikit-learn==1.2.2",
    "statsmodels>=0.14.4",
    "tqdm>=4.67.1",
    "xgboost>=2.1.4",
]

[dependency-groups]
dev = [
    "isort>=6.0.0",
    "pylint>=3.3.4",
    "pytest>=8.3.4",
    "ruff>=0.9.3",
]

[tool.isort]
profile = "black"
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
line_length = 100
indent = 4
lines_between_types = 1
known_first_party = ["src"]
default_section = "THIRDPARTY"
sections = ["FUTURE", "STDLIB", "THIRDPARTY", "FIRSTPARTY", "LOCALFOLDER"]

[tool.ruff]
line-length = 100
target-version = "py310"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
